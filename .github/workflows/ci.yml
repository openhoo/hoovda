name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache: true
      - run: go generate ./internal/atspi
      - run: git diff --exit-code -- internal/atspi/zz_generated_interfaces.go
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go build ./cmd/hoovda
      - name: Verify locked-profile oracle conformance
        run: go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json

  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --platform linux/amd64 --tag hoovda:ci .
      - run: docker run --rm --platform linux/amd64 hoovda:ci version
