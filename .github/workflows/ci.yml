name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.27.0'
          cache: true
      - run: go generate ./internal/atspi
      - run: git diff --exit-code -- internal/atspi/zz_generated_interfaces.go
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go build ./cmd/hoovda
      - name: Verify release gate remains closed without complete oracle
        run: |
          if go run ./cmd/hoovda conformance --manifest oracle/corpus/manifest.json; then
            echo "incomplete oracle corpus unexpectedly passed" >&2
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --platform linux/amd64 --tag hoovda:ci .
      - run: docker run --rm --platform linux/amd64 hoovda:ci version
